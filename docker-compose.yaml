version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentbox
      POSTGRES_USER: abox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abox_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abox -d agentbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  agentbox:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/etc/abox/config.yaml:ro
      - abox-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JWT_SECRET=${JWT_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-abox_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - ABOX_API_URL=http://agentbox:8080
    depends_on:
      - agentbox

volumes:
  pgdata:
  abox-data:
